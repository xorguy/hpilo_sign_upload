services:
  ilo-cert-upload:
    build: .
    env_file:
      # Cloudflare DNS credentials + domain + ACME email (see .env.cf.example)
      - .env.cf
    environment:
      - ILO_HOST=${ILO_HOST}
      - ILO_USER=${ILO_USER:-Administrator}
      - ILO_PASS=${ILO_PASS}
    volumes:
      # Optional: host directory containing ilo.csr (set CSR_DIR in .env).
      # If CSR_DIR is unset the named volume below is mounted (empty), and
      # the entrypoint asks iLO for its current CSR instead — generating a
      # new one there (CN=$DOMAIN, from .env.cf) if iLO doesn't have one yet.
      - ${CSR_DIR:-csr_empty}:/csr:ro
    network_mode: "bridge"
    # If the iLO is on a management VLAN that requires the host's network
    # stack/routing, switch to:
    #   network_mode: "host"

volumes:
  # Empty placeholder — used when CSR_DIR is not set so Docker has a valid mount.
  csr_empty:
